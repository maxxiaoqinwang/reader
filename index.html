<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的在线阅读器</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      height: 100vh;
      height: 100dvh;
      margin: 0;
      color: #222;
      font-family: system-ui, sans-serif;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 16px;
      min-height: 48px;
      padding: 8px 16px;
      border-bottom: 1px solid #ddd;
      background: #f4f4f4;
    }

    h1 {
      margin: 0;
      font-size: 1rem;
    }

    a {
      color: #164b82;
      text-underline-offset: 0.15em;
    }

    main {
      min-height: 0;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>我的在线阅读器</h1>
    <a href="https://www.lizhiks.com/book/229314.html"
       target="_blank" rel="noopener noreferrer">在原网站打开</a>
  </header>
  <main>
    <iframe src="https://www.lizhiks.com/book/229314.html" title="荔枝小说书籍页面"></iframe>
  </main>
</body>
</html>
