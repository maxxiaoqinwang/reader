name: Publish encrypted reader library

on:
  workflow_dispatch:
    inputs:
      book_url:
        description: HTTPS book catalog URL to import
        type: string
        required: false
      deploy:
        description: Publish the verified reader to GitHub Pages
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: reader-pages
  queue: max

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepare sync checkpoint
        if: inputs.book_url != ''
        id: checkpoint
        env:
          READER_BOOK_URL: ${{ inputs.book_url }}
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/reader-sync-checkpoint"
          book_key="${READER_BOOK_URL#https://}"
          book_key="${book_key#www.}"
          key_hash="$(printf '%s' "$book_key" | sha256sum | cut -d ' ' -f 1)"
          printf 'prefix=reader-sync-v1-%s-\n' "$key_hash" >> "$GITHUB_OUTPUT"
      - name: Restore encrypted sync checkpoint
        if: inputs.book_url != ''
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/reader-sync-checkpoint/*.enc
          key: ${{ steps.checkpoint.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.checkpoint.outputs.prefix }}
      - name: Sync chapters
        if: inputs.book_url != ''
        id: sync
        env:
          READER_BOOK_URL: ${{ inputs.book_url }}
          READER_PASSWORD: ${{ secrets.READER_PASSWORD }}
        run: |
          source_dir="$(mktemp -d "$RUNNER_TEMP/reader-source.XXXXXX")"
          source_file="$source_dir/book.json"
          python3 scripts/sync-chapters.py "$source_file" --book-url "$READER_BOOK_URL" \
            --checkpoint-dir "$RUNNER_TEMP/reader-sync-checkpoint"
          printf 'source_file=%s\n' "$source_file" >> "$GITHUB_OUTPUT"
      - name: Save encrypted sync checkpoint
        if: ${{ !cancelled() && (steps.sync.outcome == 'success' || steps.sync.outcome == 'failure') }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/reader-sync-checkpoint/*.enc
          key: ${{ steps.checkpoint.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build and verify encrypted library
        env:
          READER_PASSWORD: ${{ secrets.READER_PASSWORD }}
          READER_SYNC_ENDPOINT: ${{ vars.READER_SYNC_ENDPOINT }}
          READER_SOURCE_FILE: ${{ steps.sync.outputs.source_file }}
        run: |
          arguments=(library _site)
          if [[ -n "$READER_SOURCE_FILE" ]]; then
            arguments+=("$READER_SOURCE_FILE")
          fi
          node scripts/manage-library.mjs "${arguments[@]}"
      - name: Save encrypted library
        if: inputs.deploy
        run: |
          git add -A -- library/
          if ! git diff --cached --quiet -- library/; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --only -m 'Save encrypted reader library' -- library/
          fi
          git push origin HEAD:refs/heads/main
      - uses: actions/upload-pages-artifact@v4
        if: inputs.deploy
        with:
          path: _site

  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
