name: Sync and deploy password reader

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the verified reader to GitHub Pages
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: reader-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Sync chapters
        run: |
          source_dir="$(mktemp -d "$RUNNER_TEMP/reader-source.XXXXXX")"
          source_file="$source_dir/book.json"
          printf 'READER_SOURCE_FILE=%s\n' "$source_file" >> "$GITHUB_ENV"
          python3 scripts/sync-chapters.py "$source_file"
      - name: Build and verify encrypted reader
        env:
          READER_PASSWORD: ${{ secrets.READER_PASSWORD }}
        run: |
          node build_locked_reader.mjs "$READER_SOURCE_FILE" _site
          node scripts/verify-encrypted-release.mjs "$READER_SOURCE_FILE" _site
          mkdir _site/locked
          cat > _site/locked/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="refresh" content="0; url=../">
          <title>我的在线阅读器</title>
          <a href="../">进入阅读器</a>
          </html>
          HTML
          sha256sum _site/book.json
      - uses: actions/upload-pages-artifact@v4
        if: inputs.deploy
        with:
          path: _site

  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
