<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; connect-src 'self' https://api.github.com; img-src blob:; style-src 'sha256-d4AFLDvSALVsFv/mRIEXG9mG+0o+S5DlH/kkS3J8rE0='; form-action 'none'; base-uri 'none'">
  <meta name="reader-sync-endpoint" content="">
  <title>我的在线阅读器</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #212823;
      background: #faf9f4;
      font-family: system-ui, sans-serif;
    }

    header {
      border-bottom: 1px solid #deded5;
    }

    .container {
      width: min(100%, 46rem);
      margin: auto;
      padding-inline: 1rem;
    }

    header .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-block: 0.625rem;
    }

    h1 {
      margin: 0;
      font-size: 1.125rem;
    }

    main {
      padding-block: 2rem;
    }

    #unlock-form {
      max-width: 24rem;
      margin: 2rem auto;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
    }

    input, select, button {
      min-height: 44px;
      max-width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #818980;
      border-radius: 0.35rem;
      color: inherit;
      background: #fff;
      font: inherit;
    }

    input, select {
      width: 100%;
    }

    button {
      cursor: pointer;
    }

    #unlock {
      margin-top: 0.75rem;
      border-color: #284e3e;
      color: #fff;
      background: #284e3e;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #unlock-status {
      margin: 0.75rem 0 0;
    }

    #library-tools {
      margin: 0.75rem 0 1.5rem;
    }

    #sync-tools {
      margin-top: 0.85rem;
    }

    #sync-tools summary {
      width: fit-content;
      cursor: pointer;
      font-weight: 600;
    }

    #sync-form {
      max-width: 32rem;
      margin-top: 0.85rem;
    }

    #sync-form input {
      margin-bottom: 0.75rem;
    }

    #token-help {
      margin: 0 0 0.75rem;
      font-size: 0.875rem;
    }

    #chapter-title {
      margin: 1.75rem 0 1rem;
      font-size: 1.4rem;
      overflow-wrap: anywhere;
    }

    #chapter-body {
      margin: 0 0 2rem;
      font-size: 1.0625rem;
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #chapter-body p {
      margin: 0 0 0.85em;
    }

    #chapter-body img {
      height: 1em;
      width: auto;
      vertical-align: -0.12em;
    }
  </style>
  <script type="module" src="./reader.js"></script>
</head>
<body>
  <header>
    <div class="container">
      <h1>我的在线阅读器</h1>
      <button id="lock" type="button" hidden>锁定</button>
    </div>
  </header>
  <main class="container">
    <form id="unlock-form">
      <label for="reader-password">阅读口令</label>
      <input id="reader-password" type="password" autocomplete="off"
             autocapitalize="none" spellcheck="false" aria-describedby="unlock-status" required>
      <button id="unlock" type="submit">解锁</button>
      <p id="unlock-status" role="status"></p>
    </form>
    <section id="reader-content" hidden>
      <div id="book-controls">
        <label for="book-select">书籍</label>
        <select id="book-select"></select>
      </div>
      <div id="library-tools">
        <button id="refresh-library" type="button">刷新书单</button>
        <p id="reader-status" role="status"></p>
        <details id="sync-tools">
          <summary>添加或更新书籍</summary>
          <form id="sync-form">
            <label for="book-url">荔枝小说链接</label>
            <input id="book-url" type="url" placeholder="https://www.lizhiks.com/book/229314.html"
                   autocomplete="off" autocapitalize="none" spellcheck="false" required>
            <div id="github-token-fields">
              <label for="github-token">GitHub 访问令牌</label>
              <p id="token-help">
                <a href="https://github.com/settings/personal-access-tokens/new?name=Reader%20Sync&amp;target_name=maxxiaoqinwang&amp;actions=write"
                   target="_blank" rel="noopener noreferrer">创建细粒度令牌</a>，仅选择 reader 仓库并授予 Actions 写入权限。
              </p>
              <input id="github-token" type="password" autocomplete="off" autocapitalize="none"
                     spellcheck="false" aria-describedby="token-help" required>
            </div>
            <button id="sync-submit" type="submit">启动同步</button>
          </form>
          <p id="sync-status" role="status"></p>
        </details>
      </div>
      <div id="chapter-controls" hidden>
        <label for="chapter-select">章节</label>
        <select id="chapter-select"></select>
        <article aria-labelledby="chapter-title">
          <h2 id="chapter-title"></h2>
          <div id="chapter-body"></div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
